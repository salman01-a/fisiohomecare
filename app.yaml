runtime: nodejs24
service: project-frontend


handlers:
  - url: /assets
    static_dir: dist/assets

  - url: /(.+\..+)$
    static_files: dist/\1
    upload: dist/(.+\..+)$

  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    
# Tambahkan ini supaya hemat (untuk testing)
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 1