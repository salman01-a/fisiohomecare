steps:
  # Step 1: Install semua dependensi menggunakan Node.js image
  - name: 'node:20'
    id: 'Install Dependencies'
    entrypoint: 'npm'
    args: ['ci']

  # Step 2: Build aplikasi React/Vite (akan menghasilkan folder 'dist')
  - name: 'node:20'
    id: 'Build React App'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Step 3: Deploy file statis di folder 'dist' ke Google App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to App Engine'
    entrypoint: 'gcloud'
    args: [
      'app', 
      'deploy', 
      'app.yaml', 
      '--quiet'
    ]

# Opsi logging tambahan
options:
  logging: CLOUD_LOGGING_ONLY
